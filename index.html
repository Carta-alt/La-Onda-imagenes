<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123e73" />
  <meta name="description" content="Carta digital de Restaurante La Onda, Murcia. Cocina mediterránea, mariscos, arroces, pescados y carnes." />
  <title>Restaurante La Onda | Carta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#123e73;
      --navy-2:#0d2f59;
      --blue:#1d5c9e;
      --sea:#5b8e8c;
      --ivory:#f7f3e9;
      --paper:#fffdf8;
      --sand:#e6d7b2;
      --wood:#a96f3c;
      --wood-dark:#704626;
      --ink:#1b2a38;
      --muted:#66727e;
      --line:rgba(18,62,115,.13);
      --shadow:0 14px 40px rgba(13,47,89,.09);
      --radius:20px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:"DM Sans",system-ui,sans-serif;
      color:var(--ink);
      background:
        linear-gradient(90deg,
          rgba(112,70,38,.96) 0,
          rgba(169,111,60,.86) 11px,
          var(--ivory) 11px,
          var(--ivory) calc(100% - 11px),
          rgba(169,111,60,.86) calc(100% - 11px),
          rgba(112,70,38,.96) 100%);
      min-height:100vh;
      padding-bottom:88px;
    }

    body::before{
      content:"";
      position:fixed;inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:
        radial-gradient(circle at 20% 10%,rgba(255,255,255,.8),transparent 30%),
        repeating-linear-gradient(0deg,rgba(18,62,115,.025),rgba(18,62,115,.025) 1px,transparent 1px,transparent 4px);
      z-index:-1;
    }

    a{color:inherit}
    button,select,input{font:inherit}

    .topbar{
      position:sticky;top:0;z-index:100;
      background:rgba(247,243,233,.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(1100px,100%);
      margin:auto;
      padding:9px 16px 8px;
    }

    .brand-row{
      display:flex;align-items:center;gap:12px;
    }

    .logo-mark{
      width:42px;height:42px;border-radius:50%;
      display:grid;place-items:center;
      background:var(--navy);color:white;
      border:3px solid rgba(230,215,178,.85);
      box-shadow:0 4px 14px rgba(13,47,89,.17);
      font-family:"Marcellus",serif;
      font-size:22px;
      flex:none;
    }

    .brand{
      min-width:0;
      flex:1;
    }
    .brand strong{
      font-family:"Marcellus",serif;
      color:var(--navy-2);
      font-size:21px;
      line-height:1;
      font-weight:400;
      letter-spacing:.01em;
    }

    .language-picker{
      position:relative;
      flex:none;
    }

    .language-button{
      border:1px solid rgba(18,62,115,.10);
      background:rgba(255,253,248,.78);
      color:var(--navy-2);
      border-radius:999px;
      padding:8px 10px 8px 11px;
      display:flex;
      align-items:center;
      gap:7px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
      box-shadow:0 3px 12px rgba(13,47,89,.035);
      transition:background .2s ease,border-color .2s ease,transform .2s ease;
    }

    .language-button:active{
      transform:scale(.98);
    }

    .language-current{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .flag-real{
      width:22px;
      height:15px;
      display:inline-flex;
      flex:none;
      overflow:hidden;
      border-radius:3px;
      box-shadow:0 0 0 1px rgba(13,47,89,.12);
    }

    .flag-real svg{
      width:100%;
      height:100%;
      display:block;
    }

    .language-arrow{
      color:var(--wood);
      font-size:14px;
      line-height:1;
      transform:translateY(-1px);
    }

    .language-menu{
      position:absolute;
      top:calc(100% + 8px);
      right:0;
      width:170px;
      background:linear-gradient(145deg,rgba(18,62,115,.98),rgba(29,92,158,.94) 58%,rgba(91,142,140,.90));
      border:1px solid rgba(255,255,255,.16);
      border-radius:16px;
      padding:6px;
      box-shadow:0 18px 42px rgba(13,47,89,.28);
      opacity:0;
      visibility:hidden;
      transform:translateY(-5px) scale(.98);
      transform-origin:top right;
      transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
      z-index:300;
    }

    .language-menu.open{
      opacity:1;
      visibility:visible;
      transform:none;
    }

    .language-option{
      width:100%;
      border:0;
      background:transparent;
      display:grid;
      grid-template-columns:28px 1fr 18px;
      align-items:center;
      gap:7px;
      text-align:left;
      color:rgba(255,255,255,.88);
      border-radius:11px;
      padding:9px 8px;
      cursor:pointer;
      font-size:12px;
      transition:background .16s ease,color .16s ease;
    }

    .language-option:hover,
    .language-option:active{
      background:rgba(255,255,255,.10);
    }

    .language-option.active{
      color:#fff;
      font-weight:800;
      background:rgba(255,255,255,.14);
    }

    .language-check{
      opacity:0;
      color:var(--sand);
      font-weight:900;
      text-align:center;
    }

    .language-option.active .language-check{
      opacity:1;
    }

    .category-nav{
      display:flex;
      gap:7px;
      overflow-x:auto;
      scrollbar-width:none;
      padding-top:8px;
      padding-bottom:1px;
      scroll-snap-type:x proximity;
    }
    .category-nav::-webkit-scrollbar{display:none}
    .category-nav a{
      text-decoration:none;
      white-space:nowrap;
      padding:8px 11px;
      border-radius:999px;
      background:rgba(255,253,248,.72);
      color:var(--navy);
      border:1px solid rgba(18,62,115,.10);
      font-size:12px;
      font-weight:700;
      scroll-snap-align:start;
    }
    .category-nav a:hover{background:var(--navy);color:white}

    .hero{
      width:min(1100px,100%);
      margin:auto;
      padding:34px 22px 24px;
      text-align:center;
    }

    .crest{
      width:74px;height:74px;border-radius:50%;
      margin:0 auto 14px;
      display:grid;place-items:center;
      border:1px solid rgba(18,62,115,.2);
      background:var(--paper);
      box-shadow:var(--shadow);
      font-size:31px;
    }

    .eyebrow{
      color:var(--wood);
      text-transform:uppercase;
      letter-spacing:.2em;
      font-weight:700;
      font-size:11px;
    }

    h1{
      font-family:"Marcellus",serif;
      color:var(--navy-2);
      font-size:clamp(36px,9vw,64px);
      font-weight:400;
      margin:4px 0 7px;
      line-height:.98;
    }

    .hero p{
      margin:0 auto;
      max-width:620px;
      color:var(--muted);
      font-size:15px;
    }

    .hero-info{
      margin:20px auto 0;
      display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
    }
    .pill{
      display:inline-flex;align-items:center;gap:7px;
      border:1px solid var(--line);
      padding:8px 11px;
      border-radius:999px;
      background:rgba(255,253,248,.75);
      font-size:12px;
      font-weight:600;
      color:var(--navy);
    }

    .market-note{
      width:min(720px,calc(100% - 36px));
      margin:0 auto 25px;
      padding:13px 16px;
      background:rgba(230,215,178,.38);
      border:1px solid rgba(169,111,60,.22);
      border-radius:14px;
      color:#684728;
      font-size:12px;
      line-height:1.45;
      text-align:center;
    }

    main{width:min(980px,100%);margin:auto;padding:0 14px 30px}

    .section{
      scroll-margin-top:135px;
      margin:0 0 34px;
    }

    .section-head{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      margin-bottom:14px;
      padding:0 3px;
    }
    .section h2{
      font-family:"Marcellus",serif;
      color:var(--navy);
      font-size:29px;
      font-weight:400;
      margin:0;
      letter-spacing:.01em;
    }

    .menu-grid{
      display:grid;
      gap:10px;
    }

    .dish{
      position:relative;
      background:rgba(255,253,248,.94);
      border:1px solid var(--line);
      border-radius:16px;
      padding:11px 11px 10px;
      box-shadow:0 7px 22px rgba(13,47,89,.035);
      overflow:hidden;
    }
    .dish.popular{
      border-color:rgba(169,111,60,.45);
      background:
        linear-gradient(115deg,rgba(230,215,178,.18),rgba(255,253,248,.98) 42%);
    }
    .dish.popular::before{
      content:"";
      position:absolute;left:0;top:0;bottom:0;width:4px;
      background:var(--wood);
    }

    .dish-top{
      display:grid;
      grid-template-columns:38px minmax(0,1fr) auto;
      gap:10px;
      align-items:start;
    }
    .dish-number{
      width:36px;height:36px;border-radius:12px;
      display:grid;place-items:center;
      color:white;background:var(--navy);
      font-size:12px;font-weight:800;
      letter-spacing:.04em;
    }
    .dish-name{
      font-weight:700;
      line-height:1.25;
      color:var(--ink);
      font-size:15px;
      margin-top:1px;
    }
    .dish-sub{
      display:block;
      color:var(--muted);
      font-weight:400;
      font-size:11px;
      margin-top:3px;
      line-height:1.25;
    }
    .price{
      color:var(--navy);
      font-weight:800;
      font-size:14px;
      white-space:nowrap;
      padding-top:2px;
      text-align:right;
    }
    .price small{
      color:var(--muted);
      font-size:9px;
      display:block;
      font-weight:600;
    }

    .dish-meta{
      display:flex;align-items:center;gap:5px;flex-wrap:wrap;
      margin:7px 0 0 43px;
    }

    .tag{
      font-size:10px;
      border-radius:999px;
      padding:4px 7px;
      font-weight:800;
      background:rgba(169,111,60,.12);
      color:#82532e;
      border:1px solid rgba(169,111,60,.18);
    }
    .allergen{
      width:26px;
      height:26px;
      border-radius:50%;
      display:inline-grid;
      place-items:center;
      cursor:help;
      flex:none;
    }

    .allergen-symbol{
      width:26px;
      height:26px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
    }

    .allergen-symbol svg{
      width:16px;
      height:16px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.65;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* Paleta inspirada en la leyenda de la carta física */
    .allergen-gluten{background:#c85b3d}
    .allergen-crust{background:#438ab0}
    .allergen-egg{background:#d9983c}
    .allergen-fish{background:#215e99}
    .allergen-peanut{background:#9b674c}
    .allergen-soy{background:#4c8e7f}
    .allergen-milk{background:#353535}
    .allergen-nuts{background:#8d4b5b}
    .allergen-celery{background:#55a874}
    .allergen-mustard{background:#c9a137}
    .allergen-sesame{background:#6c6a67}
    .allergen-sulfites{background:#b9903b}
    .allergen-lupin{background:#d4a22d}
    .allergen-molluscs{background:#4694ae}

    .info-panel{
      background:var(--navy-2);
      color:white;
      border-radius:24px;
      padding:23px;
      margin-top:38px;
      box-shadow:var(--shadow);
    }
    .info-panel h2{
      font-family:"Marcellus",serif;
      font-weight:400;
      font-size:28px;
      margin:0 0 8px;
    }
    .info-panel > p{
      color:rgba(255,255,255,.7);
      margin:0 0 20px;
      font-size:13px;
    }
    .info-list{
      display:grid;gap:10px;
    }
    .info-item{
      display:flex;gap:12px;align-items:flex-start;
      text-decoration:none;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.1);
      border-radius:14px;
      padding:12px;
    }
    .info-icon{font-size:20px;line-height:1}
    .info-item strong{display:block;font-size:13px}
    .info-item span{font-size:12px;color:rgba(255,255,255,.72)}

    .legend{
      margin-top:25px;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:20px;
      padding:18px;
    }
    .legend h3{
      font-family:"Marcellus",serif;
      color:var(--navy);
      font-weight:400;
      font-size:22px;
      margin:0 0 4px;
    }
    .legend-note{
      color:var(--muted);
      font-size:11px;
      line-height:1.45;
      margin-bottom:13px;
    }
    .legend-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }
    .legend-row{
      display:flex;align-items:center;gap:7px;
      font-size:11px;
      color:var(--ink);
    }

    .floating-bar{
      position:fixed;
      left:50%;bottom:max(10px,env(safe-area-inset-bottom));
      transform:translateX(-50%);
      width:min(520px,calc(100% - 24px));
      z-index:200;
      display:grid;grid-template-columns:1fr 1fr;
      gap:8px;
      padding:8px;
      border-radius:18px;
      background:rgba(13,47,89,.93);
      backdrop-filter:blur(14px);
      box-shadow:0 14px 38px rgba(7,27,52,.28);
      border:1px solid rgba(255,255,255,.12);
    }
    .floating-bar a{
      display:flex;align-items:center;justify-content:center;gap:8px;
      min-height:48px;
      border-radius:12px;
      text-decoration:none;
      font-weight:800;
      font-size:13px;
    }
    .call-btn{background:white;color:var(--navy-2)}
    .map-btn{background:var(--wood);color:white}

    .footer{
      text-align:center;
      color:var(--muted);
      padding:28px 20px 15px;
      font-size:10px;
    }

    .fade{
      opacity:0;transform:translateY(8px);
      transition:opacity .45s ease,transform .45s ease;
    }
    .fade.visible{opacity:1;transform:none}

    @media (min-width:720px){
      body{background:
        linear-gradient(90deg,
          var(--wood-dark) 0,
          var(--wood) 24px,
          var(--ivory) 24px,
          var(--ivory) calc(100% - 24px),
          var(--wood) calc(100% - 24px),
          var(--wood-dark) 100%)}
      .topbar-inner{padding-inline:28px}
      .hero{padding-top:52px}
      .menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .legend-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .info-list{grid-template-columns:repeat(3,1fr)}
    }

    @media (min-width:1050px){
      body{
        background:
          linear-gradient(90deg,
            var(--wood-dark) 0,
            var(--wood) 34px,
            var(--ivory) 34px,
            var(--ivory) calc(100% - 34px),
            var(--wood) calc(100% - 34px),
            var(--wood-dark) 100%);
      }
    }
  
/* FICHA PREMIUM DE PLATO */
.dish-modal{position:fixed;inset:0;z-index:500;display:flex;align-items:flex-end;justify-content:center;padding:18px;background:rgba(6,20,38,.46);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s ease}
.dish-modal.open{opacity:1;visibility:visible}
.dish-sheet{position:relative;width:min(560px,100%);max-height:min(78vh,720px);overflow:auto;padding:26px 22px 24px;border:1px solid rgba(255,255,255,.58);border-radius:26px 26px 18px 18px;background:radial-gradient(circle at 85% 0%,rgba(230,215,178,.24),transparent 31%),linear-gradient(145deg,rgba(255,253,248,.995),rgba(247,243,233,.99));box-shadow:0 28px 70px rgba(4,20,38,.34);transform:translateY(28px) scale(.985);opacity:0;transition:transform .30s cubic-bezier(.2,.8,.2,1),opacity .24s ease}
.dish-modal.open .dish-sheet{transform:none;opacity:1}
.dish-sheet::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;border-radius:0 0 99px 99px;background:linear-gradient(90deg,var(--navy),var(--blue),var(--sea),var(--wood));opacity:.8}
.dish-close{position:absolute;top:14px;right:14px;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(18,62,115,.08);color:var(--navy2);font-size:20px;cursor:pointer}
.dish-modal-number{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:30px;padding:0 10px;margin-bottom:14px;border-radius:999px;background:var(--navy);color:white;font-size:11px;font-weight:800;letter-spacing:.08em}
.dish-modal h3{margin:0 42px 7px 0;font-family:"Marcellus",serif;color:var(--navy2);font-size:29px;font-weight:400;line-height:1.08}
.dish-modal-price{color:var(--woodDark);font-size:14px;font-weight:800}
.dish-description{min-height:78px;margin:0;color:#44525f;font-size:14px;line-height:1.72}
.dish-modal-allergens{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.dish-modal-allergens .allergen-label{display:flex;align-items:center;gap:6px;padding:6px 9px 6px 6px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.62);color:var(--muted);font-size:10px;font-weight:700}
12%{opacity:1}
  82%{opacity:.92}
  100%{left:118%;opacity:0}
}

body.modal-open{overflow:hidden}
@media(min-width:720px){.dish-modal{align-items:center}.dish-sheet{border-radius:26px;padding:30px 28px 28px}}
@media(prefers-reduced-motion:reduce){.premium-flash{display:none}.dish,.dish-modal,.dish-sheet{transition:none}}


.dish-modal-image{
  width:100%;
  aspect-ratio:16/9;
  margin:18px 0 18px;
  border-radius:20px;
  overflow:hidden;
  background:#e8e1d5;
  box-shadow:0 14px 34px rgba(13,47,89,.12);
}
.dish-modal-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="logo-mark">O</div>
        <div class="brand">
          <strong id="menuTitle">Carta La Onda</strong>
        </div>
        <div class="language-picker">
          <button id="languageButton" class="language-button" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="languageCurrent" class="language-current"><span class="flag flag-real" data-flag="es"></span><span>Español</span></span>
            <span class="language-arrow">⌄</span>
          </button>

          <div id="languageMenu" class="language-menu" role="menu">
            <button type="button" class="language-option active" data-lang="es" role="menuitem">
              <span class="flag-real" data-flag="es"></span><span>Español</span><span class="language-check">✓</span>
            </button>
            <button type="button" class="language-option" data-lang="en" role="menuitem">
              <span class="flag-real" data-flag="en"></span><span>English</span><span class="language-check">✓</span>
            </button>
            <button type="button" class="language-option" data-lang="fr" role="menuitem">
              <span class="flag-real" data-flag="fr"></span><span>Français</span><span class="language-check">✓</span>
            </button>
            <button type="button" class="language-option" data-lang="de" role="menuitem">
              <span class="flag-real" data-flag="de"></span><span>Deutsch</span><span class="language-check">✓</span>
            </button>
            <button type="button" class="language-option" data-lang="zh" role="menuitem">
              <span class="flag-real" data-flag="zh"></span><span>中文</span><span class="language-check">✓</span>
            </button>
          </div>
        </div>
      </div>
      <nav class="category-nav" id="categoryNav" aria-label="Categorías"></nav>
    </div>
  </header>

  <section class="hero">
    <div class="crest">⚓</div>
    <div class="eyebrow" data-i18n="murciaCuisine">Cocina mediterránea · Murcia</div>
    <h1>Restaurante<br>La Onda</h1>
    <p data-i18n="heroText">Producto, mar y cocina tradicional murciana en una carta pensada para disfrutar sin prisa.</p>
  </section>
<main id="menu"></main>

  <footer class="footer">
    <div>Restaurante La Onda · Murcia</div>
    <div data-i18n="footerNote">Carta preparada para consulta móvil.</div>
  </footer>

  
<div class="dish-modal" id="dishModal" aria-hidden="true">
  <div class="dish-sheet" role="dialog" aria-modal="true" aria-labelledby="dishModalTitle">
    <button class="dish-close" id="dishClose" type="button" aria-label="Cerrar">×</button>
    <div class="dish-modal-number" id="dishModalNumber">01</div>
    <h3 id="dishModalTitle"></h3>
    <div class="dish-modal-price" id="dishModalPrice"></div>
    <div class="dish-modal-image"><img id="dishModalImage" alt=""></div>
        <p class="dish-description" id="dishDescription"></p>

let currentLang = "es";

function dishName(es){
  if(currentLang==="es") return es;
  return (dishT[currentLang] && dishT[currentLang][es]) || es;
}

function render(){
  const t = ui[currentLang];
  document.documentElement.lang=currentLang==="zh"?"zh-CN":currentLang;
  document.getElementById("menuTitle").textContent=menuTitleT[currentLang];
  document.getElementById("dishClose").setAttribute("aria-label",closeT[currentLang]);
  document.title=documentTitleT[currentLang];
  document.getElementById("categoryNav").setAttribute("aria-label",navAriaT[currentLang]);
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.dataset.i18n;
    if(t[k]!==undefined) el.textContent=t[k];
  });

  const nav=document.getElementById("categoryNav");
  nav.innerHTML=categories.map(([id])=>`<a href="#${id}">${catT[currentLang][id]}</a>`).join("");

  let num=1;
  const menu=document.getElementById("menu");
  menu.innerHTML=categories.map(([id])=>{
    const list=dishes.filter(d=>d[0]===id);
    const cards=list.map(d=>{
      const [cat,name,price,allergens=[],tag="",unit=""] = d;
      const n=String(num++).padStart(2,"0");
      const translated=dishName(name);
      const sub="";
      const alg=allergens.map(a=>`<span class="allergen" title="${allergenNames[currentLang][a]}">${allergenIcon(a)}</span>`).join("");
      const popular=tag==="popular";
      return `<article class="dish fade ${popular?"popular":""}" data-dish-index="${dishes.indexOf(d)}" role="button" tabindex="0" aria-label="${translated}">
        <div class="dish-top">
          <div class="dish-number">${n}</div>
          <div class="dish-name">${translated}${sub}</div>
          <div class="price">${price==="S/M"?unitT[currentLang]["S/M"]:price}${unit?`<small>${unitT[currentLang][unit]||unit}</small>`:""}</div>
        </div>
        ${(popular||alg)?`<div class="dish-meta">${popular?`<span class="tag">🔥 ${t.popular}</span>`:""}${alg}</div>`:""}
      </article>`;
    }).join("");

    return `<section class="section" id="${id}">
      <div class="section-head">
        <h2>${catT[currentLang][id]}</h2>
      </div>
      <div class="menu-grid">${cards}</div>
    </section>`;
  }).join("") + infoHTML(t);

  activateAnimations();
}

function infoHTML(t){
  const legends=Object.keys(A).filter(key=>dishes.some(d=>(d[3]||[]).includes(key))).map(key=>
    `<div class="legend-row"><span class="allergen">${allergenIcon(key)}</span><span>${allergenNames[currentLang][key]}</span></div>`
  ).join("");

  return `
  <section class="info-panel fade" id="informacion">
    <h2>${t.info}</h2>
    <p>${t.about}</p>
    <div class="info-list">
      <a class="info-item" href="https://www.google.com/maps/search/?api=1&query=Restaurante%20La%20Onda%2C%20C.%20Bando%20de%20la%20Huerta%2C%20s%2Fn%2C%2030008%20Murcia" target="_blank" rel="noopener">
        <div class="info-icon">📍</div><div><strong>${t.address}</strong><span>C. Bando de la Huerta, s/n, 30008 Murcia</span></div>
      </a>
      <div class="info-item">
        <div class="info-icon">🕒</div><div><strong>${t.hours}</strong><span>${t.schedule}</span></div>
      </div>
      <a class="info-item" href="tel:+34968247882">
        <div class="info-icon">☎</div><div><strong>${t.phone}</strong><span>968 24 78 82</span></div>
      </a>
    </div>
  </section>
  <section class="legend fade">
    <h3>${t.allergens}</h3>
    <div class="legend-note">${t.allergenNote}</div>
    <div class="legend-grid">${legends}</div>
  </section>`;
}

function activateAnimations(){
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add("visible");io.unobserve(e.target);}
    })
  },{threshold:.06});
  document.querySelectorAll(".fade").forEach(el=>io.observe(el));
}

const languageLabels = {
  es:["Español"],
  en:["English"],
  fr:["Français"],
  de:["Deutsch"],
  zh:["中文"]
};

document.querySelectorAll("[data-flag]").forEach(el=>{
  el.innerHTML = flagSVG[el.dataset.flag];
});

const languageButton = document.getElementById("languageButton");
const languageMenu = document.getElementById("languageMenu");
const languageCurrent = document.getElementById("languageCurrent");

languageButton.addEventListener("click",()=>{
  const isOpen = languageMenu.classList.toggle("open");
  languageButton.setAttribute("aria-expanded", String(isOpen));
});

document.querySelectorAll(".language-option").forEach(option=>{
  option.addEventListener("click",()=>{
    currentLang = option.dataset.lang;
    const selectedLanguage = languageLabels[currentLang];
    languageCurrent.innerHTML = `<span class="flag-real">${flagSVG[currentLang]}</span><span>${selectedLanguage[0]}</span>`;

    document.querySelectorAll(".language-option").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.lang === currentLang);
    });

    languageMenu.classList.remove("open");
    languageButton.setAttribute("aria-expanded","false");
    render();
  });
});

document.addEventListener("click",(e)=>{
  if(!e.target.closest(".language-picker")){
    languageMenu.classList.remove("open");
    languageButton.setAttribute("aria-expanded","false");
  }
});

/* FICHA DE PLATO PREMIUM */
const dishModal=document.getElementById("dishModal");
const dishModalTitle=document.getElementById("dishModalTitle");
const dishModalNumber=document.getElementById("dishModalNumber");
const dishModalPrice=document.getElementById("dishModalPrice");
const dishModalImage=document.getElementById("dishModalImage");
const dishDescription=document.getElementById("dishDescription");
const dishModalAllergens=document.getElementById("dishModalAllergens");
let typeTimer=null;
function typeText(text){clearInterval(typeTimer);dishDescription.textContent="";if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){dishDescription.textContent=text;return}let i=0;typeTimer=setInterval(()=>{dishDescription.textContent+=text.charAt(i++);if(i>=text.length)clearInterval(typeTimer)},16)}
function openDish(index){const dish=dishes[index];if(!dish)return;const[,name,price,allergens=[],tag="",unit=""]=dish;dishModalNumber.textContent=String(index+1).padStart(2,"0");dishModalTitle.textContent=dishName(name);dishModalPrice.textContent=unit?`${price==="S/M"?unitT[currentLang]["S/M"]:price} · ${unitT[currentLang][unit]||unit}`:(price==="S/M"?unitT[currentLang]["S/M"]:price);dishModalImage.src=dishImages[index];dishModalImage.alt=dishName(name);dishModalAllergens.innerHTML=allergens.map(key=>`<span class="allergen-label">${allergenIcon(key)}<span>${allergenNames[currentLang][key]}</span></span>`).join("");dishDescription.textContent="";dishModal.classList.add("open");dishModal.setAttribute("aria-hidden","false");document.body.classList.add("modal-open");
const rawDescription=(dishDescriptionsByLang[currentLang]&&dishDescriptionsByLang[currentLang][name])||dishDescriptionsByLang.es[name]||name;const localizedDescription=rawDescription.replaceAll("{DISH}",dishName(name));dishDescription.textContent=localizedDescription;}
function closeDish(){clearInterval(typeTimer);dishModal.classList.remove("open");dishModal.setAttribute("aria-hidden","true");document.body.classList.remove("modal-open")}
document.addEventListener("click",e=>{const card=e.target.closest(".dish[data-dish-index]");if(card)openDish(Number(card.dataset.dishIndex));if(e.target===dishModal||e.target.closest("#dishClose"))closeDish()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dishModal.classList.contains("open"))closeDish();if((e.key==="Enter"||e.key===" ")&&document.activeElement?.matches(".dish[data-dish-index]")){e.preventDefault();openDish(Number(document.activeElement.dataset.dishIndex))}});

render();
</script>
</body>
</html>
